{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚌 PakBus — Bus Schedule</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <nav>
        <a href="/" class="brand">🚌 PakBus</a>
        <div>
            {% if user.is_authenticated %}
                <a href="/book/my/">My Bookings</a>
                <a href="/users/logout/">Logout ({{ user.username }})</a>
            {% else %}
                <a href="/users/login/">Login</a>
                <a href="/users/register/">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
