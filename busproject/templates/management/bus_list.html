{% extends 'management/base_manage.html' %}
{% block manage_content %}
<div class="manage-card">
    <div class="manage-header">
        <h2>🚌 Buses</h2>
        <a href="/manage/buses/add/" class="btn-add">+ Add Bus</a>
    </div>
    <table>
        <tr><th>#</th><th>Bus Number</th><th>Type</th><th>Seats</th><th>Actions</th></tr>
        {% for bus in buses %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ bus.bus_number }}</td>
            <td>{{ bus.bus_type }}</td>
            <td>{{ bus.total_seats }}</td>
            <td>
                <a href="/manage/buses/edit/{{ bus.id }}/" class="btn-edit">✏️ Edit</a>
                <a href="/manage/buses/delete/{{ bus.id }}/" class="btn-delete">🗑️ Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
