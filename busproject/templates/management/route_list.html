{% extends 'management/base_manage.html' %}
{% block manage_content %}
<div class="manage-card">
    <div class="manage-header">
        <h2>🗺️ Routes</h2>
        <a href="/manage/routes/add/" class="btn-add">+ Add Route</a>
    </div>
    <table>
        <tr><th>#</th><th>From</th><th>To</th><th>Distance (km)</th><th>Actions</th></tr>
        {% for route in routes %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ route.from_city }}</td>
            <td>{{ route.to_city }}</td>
            <td>{{ route.distance_km }} km</td>
            <td>
                <a href="/manage/routes/edit/{{ route.id }}/" class="btn-edit">✏️ Edit</a>
                <a href="/manage/routes/delete/{{ route.id }}/" class="btn-delete">🗑️ Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
