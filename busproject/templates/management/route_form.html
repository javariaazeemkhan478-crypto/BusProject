{% extends 'management/base_manage.html' %}
{% block manage_content %}
<div class="manage-card">
    <div class="manage-header">
        <h2>🗺️ {{ action }} Route</h2>
    </div>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>From City</label>
            <select name="from_city" required>
                {% for city in cities %}
                <option value="{{ city.id }}" {% if obj.from_city_id == city.id %}selected{% endif %}>{{ city.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>To City</label>
            <select name="to_city" required>
                {% for city in cities %}
                <option value="{{ city.id }}" {% if obj.to_city_id == city.id %}selected{% endif %}>{{ city.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Distance (km)</label>
            <input type="number" name="distance_km" value="{{ obj.distance_km }}" placeholder="e.g. 1200" required />
        </div>
        <button type="submit" class="btn-save">💾 Save</button>
        <a href="/manage/routes/" class="btn-cancel">Cancel</a>
    </form>
</div>
{% endblock %}
