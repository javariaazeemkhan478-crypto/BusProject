{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
.manage-wrapper { max-width: 1000px; margin: 30px auto; }

.manage-nav {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 30px;
    background: white;
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.manage-nav a {
    padding: 8px 18px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    color: #555;
    transition: all 0.2s;
}

.manage-nav a:hover,
.manage-nav a.active {
    background: #1a73e8;
    color: white;
}

.manage-card {
    background: white;
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.manage-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid #f0f0f0;
}

.manage-header h2 { font-size: 22px; color: #1a1a2e; }

.btn-add {
    background: #43a047;
    color: white;
    padding: 9px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    transition: background 0.2s;
}

.btn-add:hover { background: #2e7d32; }

table { width: 100%; border-collapse: collapse; }
th {
    background: #1a73e8;
    color: white;
    padding: 12px 16px;
    text-align: left;
    font-size: 14px;
}
td {
    padding: 12px 16px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
    color: #333;
}
tr:hover td { background: #f8f9ff; }

.btn-edit {
    background: #fff8e1;
    color: #f57c00;
    border: 1px solid #ffcc02;
    padding: 5px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    margin-right: 6px;
}

.btn-delete {
    background: #fdecea;
    color: #e53935;
    border: 1px solid #f5c6c5;
    padding: 5px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
}

.btn-edit:hover   { background: #fff3cd; }
.btn-delete:hover { background: #fcd9d8; }

.form-group { margin-bottom: 20px; }
.form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #555;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
}

.form-group input:focus,
.form-group select:focus { border-color: #1a73e8; }

.btn-save {
    background: #1a73e8;
    color: white;
    padding: 12px 32px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}

.btn-save:hover { background: #1558b0; }

.btn-cancel {
    background: white;
    color: #555;
    padding: 12px 24px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    text-decoration: none;
    margin-left: 10px;
}

.delete-box {
    text-align: center;
    padding: 20px;
}

.delete-box p { font-size: 16px; color: #555; margin-bottom: 24px; }

.btn-confirm-delete {
    background: #e53935;
    color: white;
    padding: 12px 32px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.btn-confirm-delete:hover { background: #b71c1c; }
</style>

<div class="manage-wrapper">
    <div class="manage-nav">
        <a href="/manage/">🏠 Dashboard</a>
        <a href="/manage/cities/">🏙️ Cities</a>
        <a href="/manage/routes/">🗺️ Routes</a>
        <a href="/manage/buses/">🚌 Buses</a>
        <a href="/manage/schedules/">🕐 Schedules</a>
        <a href="/" style="margin-left:auto;">← Back to Site</a>
    </div>
    {% block manage_content %}{% endblock %}
</div>
{% endblock %}
