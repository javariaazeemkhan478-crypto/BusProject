{% extends 'management/base_manage.html' %}
{% block manage_content %}
<div class="manage-card">
    <div class="manage-header">
        <h2 style="color:#e53935;">🗑️ Confirm Delete</h2>
    </div>
    <div class="delete-box">
        <div style="font-size:60px; margin-bottom:16px;">⚠️</div>
        <p>Are you sure you want to delete <strong>{{ obj }}</strong>?<br>
        <span style="color:#e53935;">This action cannot be undone.</span></p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-confirm-delete">🗑️ Yes, Delete</button>
            <a href="javascript:history.back()" class="btn-cancel">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
