{% extends 'management/base_manage.html' %}
{% block manage_content %}
<div class="manage-card">
    <div class="manage-header">
        <h2>🚌 {{ action }} Bus</h2>
    </div>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Bus Number</label>
            <input type="text" name="bus_number" value="{{ obj.bus_number }}" placeholder="e.g. LHR-001" required />
        </div>
        <div class="form-group">
            <label>Total Seats</label>
            <input type="number" name="total_seats" value="{{ obj.total_seats }}" placeholder="e.g. 40" required />
        </div>
        <div class="form-group">
            <label>Bus Type</label>
            <select name="bus_type" required>
                <option value="AC"      {% if obj.bus_type == 'AC' %}selected{% endif %}>AC</option>
                <option value="Non-AC"  {% if obj.bus_type == 'Non-AC' %}selected{% endif %}>Non-AC</option>
                <option value="Sleeper" {% if obj.bus_type == 'Sleeper' %}selected{% endif %}>Sleeper</option>
            </select>
        </div>
        <button type="submit" class="btn-save">💾 Save</button>
        <a href="/manage/buses/" class="btn-cancel">Cancel</a>
    </form>
</div>
{% endblock %}
