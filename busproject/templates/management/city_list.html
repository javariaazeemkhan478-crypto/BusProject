{% extends 'management/base_manage.html' %}
{% block manage_content %}
<div class="manage-card">
    <div class="manage-header">
        <h2>🏙️ Cities</h2>
        <a href="/manage/cities/add/" class="btn-add">+ Add City</a>
    </div>
    <table>
        <tr><th>#</th><th>City Name</th><th>Actions</th></tr>
        {% for city in cities %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ city.name }}</td>
            <td>
                <a href="/manage/cities/edit/{{ city.id }}/" class="btn-edit">✏️ Edit</a>
                <a href="/manage/cities/delete/{{ city.id }}/" class="btn-delete">🗑️ Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
